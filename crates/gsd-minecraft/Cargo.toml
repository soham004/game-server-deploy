[package]
name = "gsd-minecraft"
description = "Minecraft adapter: version catalogs, installers, log parsing and diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Recorded-API mock and fake Java for other crates' tests.
test-support = ["dep:wiremock", "dep:sha1"]

[dependencies]
gsd-brand.workspace = true
gsd-core.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
hex.workspace = true
# Offline-mode player UUIDs are MD5 based, as Java's `UUID.nameUUIDFromBytes`.
md-5.workspace = true
# Player heads, cut from skins.
png.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
zip.workspace = true
# Only with `test-support`:
sha1 = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true

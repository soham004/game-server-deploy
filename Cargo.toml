[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Internal crates
gsd-brand = { path = "crates/gsd-brand" }
gsd-core = { path = "crates/gsd-core" }
gsd-minecraft = { path = "crates/gsd-minecraft" }
gsd-mods = { path = "crates/gsd-mods" }

# External crates
anyhow = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.23"
bytes = "1"
cap-std = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
croner = "4"
directories = "6"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
ipnet = { version = "2", features = ["serde"] }
landlock = "0.4"
libc = "0.2"
mime_guess = "2"
nix = { version = "0.31", features = ["resource", "signal", "user", "process"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
rust-embed = "8"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "derive", "macros"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "3", features = ["serde"] }
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
# `deny` (not `forbid`) so the Linux sandbox module can opt in for `pre_exec`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# axum handlers and extractors are async and take arguments by value by design.
unused_async = "allow"
unused_async_trait_impl = "allow"
needless_pass_by_value = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
